name: Build Android AAB and APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BetfairStrategyLabAndroid

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is missing"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "KEY_ALIAS is missing"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "KEY_PASSWORD is missing"
            exit 1
          fi

          echo "All signing secrets are configured."

      - name: Decode Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          test -s upload-keystore.jks
          echo "Keystore successfully created."

      - name: Build signed release AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/BetfairStrategyLabAndroid/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/BetfairStrategyLabAndroid/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: BetfairStrategyLab-AAB
          path: BetfairStrategyLabAndroid/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BetfairStrategyLab-APK
          path: BetfairStrategyLabAndroid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
